name: Draft package release
on:
  push:
    branches: [main]
    paths:
      - "packages/colorshower/**"
  workflow_dispatch:
    inputs:
      version-mode:
        description: Version mode
        type: choice
        options: [bump, package-json, exact]
        default: package-json
      version-bump:
        description: Version bump
        type: choice
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]
        default: patch
      exact-version:
        description: Exact version when version-mode is exact
        type: string
        default: ""
      dry-run:
        description: Preview without modifying drafts
        type: boolean
        default: true
permissions:
  contents: write
  pull-requests: read
jobs:
  draft:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_release-drafter.yml@main
    with:
      target-branch: main
      version-mode: ${{ github.event_name == 'workflow_dispatch' && inputs.version-mode || 'package-json' }}
      version-bump: ${{ github.event_name == 'workflow_dispatch' && inputs.version-bump || 'patch' }}
      exact-version: ${{ github.event_name == 'workflow_dispatch' && inputs.exact-version || '' }}
      package-name: "@moyarich/colorshower"
      package-directory: packages/colorshower
      tag-prefix: "packages/colorshower@"
      target-key: packages/colorshower
      release-name: "@moyarich/colorshower v{{VERSION}}"
      changelog-path: packages/colorshower/CHANGELOG.md
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || github.event_name != 'workflow_dispatch' && false }}
