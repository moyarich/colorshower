name: Publish npm package
run-name: >-
  Publish · ${{ inputs.package }} · ${{ inputs.registry }} · dry-run=${{ inputs.dry-run }}
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package selector
        type: string
        default: packages/colorshower
      version-mode:
        description: Version resolution
        type: choice
        options: [package-json, exact]
        default: package-json
      exact-version:
        description: Exact version when version-mode is exact
        type: string
        default: ""
      registries-file:
        description: Optional caller registry YAML file
        type: string
        default: ""
      registry:
        description: Package registry
        type: choice
        options: [github, npm, all]
        default: github
      tag:
        description: Distribution tag
        type: string
        default: ""
      dry-run:
        description: Preview without publishing
        type: boolean
        default: true
permissions:
  contents: write
  packages: write
jobs:
  publish:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@main
    with:
      package-directory: ${{ inputs.package }}
      target-branch: ${{ github.ref_name }}
      registry: ${{ inputs.registry }}
      tag: ${{ inputs.tag }}
      version-mode: ${{ inputs.version-mode }}
      exact-version: ${{ inputs.exact-version }}
      registries-file: ${{ inputs.registries-file }}
      verify-git-tag: true
      dry-run: ${{ inputs.dry-run }}
      node-version: "24"
    secrets:
      npm-token: ${{ secrets._NPM_TOKEN }}
