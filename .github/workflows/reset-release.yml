name: Reset release
on:
  workflow_dispatch:
    inputs:
      match-mode:
        description: Match package manifest or exact tag
        type: choice
        options: [package-json, exact]
        default: package-json
      exact-tag:
        description: Tag to reset in exact mode
        type: string
        default: ""
      dry-run:
        description: Preview without mutations
        type: boolean
        default: true
permissions: {}
jobs:
  reset:
    permissions:
      actions: read
      contents: write
      packages: read
      pull-requests: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_bulk-reset-release.yml@main
    with:
      package: packages/colorshower
      target-branch: main
      match-mode: ${{ inputs.match-mode }}
      exact-tag: ${{ inputs.exact-tag }}
      dry-run: ${{ inputs.dry-run }}
