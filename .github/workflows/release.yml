name: Release package
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version from packages/colorshower/package.json
        type: string
        required: true
        default: "0.1.0"
      create-tag:
        description: Create the release tag if missing
        type: boolean
        default: true
      release-notes:
        description: Optional release notes override
        type: string
        default: ""
      major-tag:
        description: Optional major compatibility tag
        type: string
        default: ""
      update-major-tag:
        description: Move the major tag
        type: boolean
        default: false
      draft:
        description: Leave GitHub release as draft
        type: boolean
        default: true
      dry-run:
        description: Preview without changing release or tags
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  release:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_release.yml@main
    with:
      version: ${{ inputs.version }}
      release-tag: packages/colorshower@${{ inputs.version }}
      release-name: "@moyarich/colorshower v${{ inputs.version }}"
      changelog-file: packages/colorshower/CHANGELOG.md
      target-ref: main
      dry-run: ${{ inputs.dry-run }}
      create-tag: ${{ inputs.create-tag }}
      release-notes: ${{ inputs.release-notes }}
      major-tag: ${{ inputs.major-tag }}
      update-major-tag: ${{ inputs.update-major-tag }}
      draft: ${{ inputs.draft }}
