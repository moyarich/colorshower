name: Validate unified VSIX publishing
on:
  push:
    branches:
      - test/unified-vsix-publisher-dry-run
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_vscode-publish.yml@refactor/unify-vscode-publishing
    with:
      package-directory: packages/colorshower
      install-command: npm install --include=optional
      check-command: npm run check
      artifact-glob: packages/colorshower/artifacts/*.vsix
      artifact-name: colorshower-unified-vsix
      registry: all
      dry-run: true
