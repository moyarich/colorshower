name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  lint-workflows:
    name: Validate workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color -shellcheck=

  checks:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_node-ci.yml@main
    with:
      package-directory: .
      node-version: "24"
