name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      checkout-sha:
        description: Exact commit SHA to validate
        type: string
        required: false
        default: ""
permissions:
  contents: read
  packages: read
jobs:
  checks:
    name: Node / build, lint, typecheck, tests
    uses: ./.github/workflows/ci_cli.yml
    with:
      checkout-sha: ${{ inputs.checkout-sha || '' }}
