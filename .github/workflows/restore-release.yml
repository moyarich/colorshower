name: Restore release
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package selector (all, name, or directory)
        type: string
        default: packages/colorshower
      target-branch:
        description: Release target branch
        type: string
        default: main
      restore-source:
        description: "commit:<sha>, tag:<tag>, run:<id>, artifact:<id>, or github-url:<url>"
        required: true
        type: string
      match-mode:
        type: choice
        options: [package-json, exact]
        default: package-json
      exact-tag:
        description: Tag to restore in exact mode
        type: string
        default: ""
      skip-finalized:
        description: Leave finalized releases unchanged
        type: boolean
        default: true
      dry-run:
        description: Preview without mutations
        type: boolean
        default: true
permissions: {}
jobs:
  restore:
    permissions:
      actions: read
      contents: write
      packages: read
      pull-requests: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_bulk-restore-release.yml@main
    with:
      package: ${{ inputs.package }}
      target-branch: ${{ inputs.target-branch }}
      restore-source: ${{ inputs.restore-source }}
      match-mode: ${{ inputs.match-mode }}
      exact-tag: ${{ inputs.exact-tag }}
      skip-finalized: ${{ inputs.skip-finalized }}
      dry-run: ${{ inputs.dry-run }}
